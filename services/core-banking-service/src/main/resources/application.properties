spring.application.name=core-banking-service

# PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexora}
spring.datasource.username=${DATABASE_USERNAME:nexora}
spring.datasource.password=${DATABASE_PASSWORD:nexora_dev_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Server
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health,info

JWT_SECRET=${JWT_SECRET:nexora-local-development-secret-key-2026-change-me}